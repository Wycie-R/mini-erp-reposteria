spring.application.name=costo-stock-app

# Configuración H2 Local
# Por alguna razón no me deja usar la característica: AUTO_SERVER=TRUE
spring.datasource.url=jdbc:h2:file:./data/reposteria_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

#  Apago el Open-In-View para ahorrar memoria
spring.jpa.open-in-view=false

# Consola H2 en web y JPA
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true